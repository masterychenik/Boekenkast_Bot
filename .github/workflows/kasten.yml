name: kasten-plaatjes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python verwerk_kasten.py
      - run: python test_bot.py
      - name: commit en opruimen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q img/*.b64 verwerk_kasten.py .github/workflows/kasten.yml
          git add index.html
          git commit -m "index.html herbouwd met kast-plaatjes" || echo "niets te doen"
          git push
