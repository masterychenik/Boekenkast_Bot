

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BibBob</title>
<style>
  :root {
    --toneel: #fbf9f4;
    --lijn: #3a3a3a;
    --accent: #c25b3a;
    --boek: #4a6d8c;
    --chat-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--toneel);
    color: var(--lijn);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    text-align: center;
    padding: 10px 0 4px;
    border-bottom: 1px solid #d8d2c4;
  }
  header h1 { margin: 0; font-size: 1.3em; }
  header p { margin: 2px 0 6px; font-size: 0.85em; color: #6b675e; }

  /* Toneel */
  #toneel {
    position: relative;
    height: 260px;
    overflow: hidden;
    background: linear-gradient(#fbf9f4 78%, #efe9dc 78%);
    flex: none;
  }
  .kast {
    position: absolute;
    bottom: 8px;
    width: 120px;
    transition: opacity 400ms, filter 400ms;
  }
  .kast.dim { opacity: 0.35; filter: grayscale(0.7); }
  .kast img.plaatje { width: 100%; display: block; }
  .kast svg { width: 100%; height: auto; }
  #kast_studentgegevens { left: 6%; }
  #kast_resultaatverwerking { left: 28%; }
  #kast_certificeren { left: 50%; }
  #kast_diplomeren { left: 72%; }
  .naambubbel {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1px solid var(--lijn);
    border-radius: 8px;
    padding: 1px 7px;
    font-size: 0.72em;
    white-space: nowrap;
    opacity: 1;
  }
  .boekje {
    position: absolute;
    left: 50%;
    top: -46px;
    transform: translateX(-50%) scale(0.3);
    opacity: 0;
    transition: transform 500ms ease, opacity 500ms;
  }
  .kast.pakuit .boekje { opacity: 1; transform: translateX(-50%) scale(1); }
  .faqkaart {
    position: absolute;
    right: 3%;
    bottom: 20px;
    width: 110px;
    opacity: 0;
    transform: rotate(-4deg) translateY(20px);
    transition: opacity 500ms, transform 500ms;
  }
  .faqkaart.aan { opacity: 1; transform: rotate(-4deg) translateY(0); }

  /* Chat */
  #chat {
    flex: 1;
    overflow-y: auto;
    background: var(--chat-bg);
    border-top: 1px solid #d8d2c4;
    padding: 10px 14px;
  }
  .regel { margin: 6px 0; line-height: 1.4; }
  .regel.jij { text-align: right; }
  .regel.jij span {
    display: inline-block;
    background: #efe9dc;
    border-radius: 10px 10px 0 10px;
    padding: 5px 10px;
  }
  .regel.bot span {
    display: inline-block;
    background: #f4f7fa;
    border: 1px solid #d7e0ea;
    border-radius: 10px 10px 10px 0;
    padding: 5px 10px;
    max-width: 85%;
  }
  #voorbeelden { padding: 6px 10px; border-top: 1px solid #eee; }
  #voorbeelden button, #stuur {
    font-family: inherit;
    background: var(--toneel);
    border: 1px solid #c9c2b2;
    border-radius: 12px;
    padding: 3px 10px;
    margin: 2px 3px 2px 0;
    cursor: pointer;
    font-size: 0.85em;
    color: var(--lijn);
  }
  #voorbeelden button:hover, #stuur:hover { background: #efe9dc; }
  #invoerrij {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    border-top: 1px solid #d8d2c4;
  }
  #vraag {
    flex: 1;
    font-family: inherit;
    font-size: 1em;
    padding: 7px 10px;
    border: 1px solid #c9c2b2;
    border-radius: 8px;
    background: #fff;
  }
  #stuur { border-radius: 8px; padding: 7px 14px; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>BibBob</h1>
  <p>Eerst de FAQ. Past geen FAQ-item? Dan overleggen mijn vier kasten welk specialisme de vraag raakt; die kast blijft en leest uit eigen boeken.</p>
</header>

<div id="toneel">
  <div class="kast" id="kast_studentgegevens"></div>
  <div class="kast" id="kast_resultaatverwerking"></div>
  <div class="kast" id="kast_certificeren"></div>
  <div class="kast" id="kast_diplomeren"></div>
  <div class="faqkaart" id="faqkaart"></div>
</div>

<div id="chat"></div>

<div id="voorbeelden"></div>

<div id="invoerrij">
  <input id="vraag" type="text" placeholder="Stel je vraag..." autocomplete="off">
  <button id="stuur">Vraag</button>
</div>

// ---------- Vraag-logica ----------
function norm(t) {
  t = t.toLowerCase();
  t = t.replace(/[!?.,;:()'"]+/g, " ");
  return t.replace(/\s+/g, " ").trim();
}
function words(t) { return norm(t).split(" ").filter(w => w.length >= 3); }
function raak(w, k) { return w.some(x => x === k || x.startsWith(k)); }
function faqOplossing(vraag) {
  // FAQ-item met de beste score, of null.
  const w = words(vraag);
  if (!w.length) return null;
  let beste = null;
  for (const item of INHOUD.faq) {
    const score = item.k.reduce((s, k) => s + (raak(w, k) ? 1 : 0), 0);
    if (score > 0 && (!beste || score > beste.score)) {
      beste = { score, item };
    }
  }
  return beste;
}
function kastOplossing(vraag) {
  // retourneert {score, kast, item} met de beste match, of null
  const w = words(vraag);
  if (!w.length) return null;
  let beste = null;
  for (const [sleutel, kast] of Object.entries(INHOUD.kasten)) {
    for (const item of kast.items) {
      const score = item.k.reduce((s, k) => s + (raak(w, k) ? 1 : 0), 0);
      if (score > 0 && (!beste || score > beste.score)) {
        beste = { score, kast: sleutel, item };
      }
    }
  }
  return beste;
}
function kastScore(sleutel, vraag) {
  // beste match van één kast op de vraag: {score, item} of null.
  // Elke kast scoort alleen op zijn eigen boeken (eigen specialisme-kennis).
  const w = words(vraag);
  if (!w.length) return null;
  let beste = null;
  for (const item of INHOUD.kasten[sleutel].items) {
    const score = item.k.reduce((s, k) => s + (raak(w, k) ? 1 : 0), 0);
    if (score > 0 && (!beste || score > beste.score)) {
      beste = { score, item };
    }
  }
  return beste;
}

// ---------- Toneel-scènes ----------
const toneel = document.getElementById("toneel");
const alleKasten = ["kast_studentgegevens", "kast_resultaatverwerking", "kast_certificeren", "kast_diplomeren"];

// De kast die het laatst een antwoord gaf; vervolgvragen blijven daar.
let laatsteKast = null;

// Domein-sleutel (bijv. "certificeren") naar toneel-id ("kast_certificeren").
function kastId(sleutel) { return "kast_" + sleutel; }

function initToneel() {
  for (const id of alleKasten) {
    const el = document.getElementById(id);
    el.innerHTML = kastSVG(id);
    el.querySelector(".naambubbel").textContent = INHOUD.namen[id];
  }
  document.getElementById("faqkaart").innerHTML = faqSVG();
}
function kastAan(id, pakUit) {
  const el = document.getElementById(id);
  el.classList.remove("dim");
  if (pakUit) el.classList.add("pakuit");
}
function allesWeg() {
  for (const id of alleKasten) {
    const el = document.getElementById(id);
    el.classList.add("dim");
    el.classList.remove("pakuit");
  }
  document.getElementById("faqkaart").classList.remove("aan");
}
function faqAan() { document.getElementById("faqkaart").classList.add("aan"); }

// ---------- Chat ----------
const chat = document.getElementById("chat");
function zeg(tekst, jij) {
  const div = document.createElement("div");
  div.className = "regel " + (jij ? "jij" : "bot");
  const span = document.createElement("span");
  span.textContent = tekst;
  div.appendChild(span);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function typeOut(tekst, klaar) {
  // typ het antwoord letter voor letter
  let i = 0;
  const div = document.createElement("div");
  div.className = "regel bot";
  const span = document.createElement("span");
  div.appendChild(span);
  chat.appendChild(div);
  const timer = setInterval(() => {
    span.textContent = tekst.slice(0, ++i);
    chat.scrollTop = chat.scrollHeight;
    if (i >= tekst.length) { clearInterval(timer); if (klaar) klaar(); }
  }, 12);
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function solve(vraag, klaar) {
  const faq = faqOplossing(vraag);
  const best = kastOplossing(vraag);
  // 1. FAQ eerst: sterke FAQ-match (score >= 2), of geen enkele kast die iets vindt.
  if (faq && (faq.score >= 2 || !best)) {
    laatsteKast = null;
    allesWeg();
    faqAan();
    initVoorbeelden();
    typeOut(faq.item.a, klaar);
    return;
  }
  document.getElementById("faqkaart").classList.remove("aan");

  // 2. Vervolgvraag binnen het specialisme van de kast die bleef staan:
  //    die kast blijft en antwoordt uit zijn eigen boeken.
  if (laatsteKast) {
    const eigen = kastScore(laatsteKast, vraag);
    if (eigen) {
      allesWeg();
      kastAan(kastId(laatsteKast), false);
      const kast = INHOUD.kasten[laatsteKast];
      typeOut(kast.hallo, () => {
        document.getElementById(kastId(laatsteKast)).classList.add("pakuit");
        typeOut(eigen.item.a, () => {
          kastKnoppen(laatsteKast, eigen.item.v);
          if (klaar) klaar();
        });
      });
      return;
    }
  }

  // 3. Geen FAQ-item: de vier kasten overleggen welk specialisme de vraag raakt.
  //    De kast met de beste match op zijn eigen boeken wint, blijft en antwoordt.
  if (best) {
    laatsteKast = best.kast;
    allesWeg();
    for (const id of alleKasten) kastAan(id, false);
    const overleg = alleKasten.map(id => {
      const sleutel = id.replace(/^kast_/, "");
      const s = kastScore(sleutel, vraag);
      const naam = INHOUD.kasten[sleutel].kast_naam;
      return s
        ? naam + ": " + s.score + (s.score > 1 ? " treffers" : " treffer") + " in eigen boeken (" + INHOUD.kasten[sleutel].naam + ")"
        : naam + ": niet mijn domein";
    });
    typeOut("Geen FAQ-item past. De vier kasten slaan hun eigen boeken open en overleggen...", () => {
      typeOut(overleg.join("  ·  "), () => {
        for (const id of alleKasten) {
          if (id !== kastId(best.kast)) document.getElementById(id).classList.add("dim");
        }
        const kast = INHOUD.kasten[best.kast];
        document.getElementById(kastId(best.kast)).classList.add("pakuit");
        typeOut("Na overleg: " + kast.kast_naam + " blijft en leest voor uit eigen boek over " + kast.naam + ": " + best.item.a, () => {
          kastKnoppen(best.kast, best.item.v);
          if (klaar) klaar();
        });
      });
    });
    return;
  }

  // 4. Nergens een match: blijf in de open kast met zijn vragen, of fallback.
  if (laatsteKast) {
    const kast = INHOUD.kasten[laatsteKast];
    allesWeg();
    kastAan(kastId(laatsteKast), false);
    typeOut("Dat staat niet in het boek van " + kast.kast_naam + ". Wel in dit boek:", () => {
      document.getElementById(kastId(laatsteKast)).classList.add("pakuit");
      kastKnoppen(laatsteKast, vraag);
      typeOut("Kies hieronder een vervolgvraag, of stel een nieuwe vraag.", klaar);
    });
    return;
  }
  allesWeg();
  initVoorbeelden();
  typeOut(pick(INHOUD.fallback), klaar);
}

// ---------- Voorbeeldvragen ----------
function initVoorbeelden() {
  const box = document.getElementById("voorbeelden");
  box.innerHTML = "";
  const knoppen = [];
  for (const item of INHOUD.faq) knoppen.push(item.v);
  for (const kast of Object.values(INHOUD.kasten)) {
    knoppen.push(kast.items[kast.items.length - 1].v);
  }
  for (const v of knoppen) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => stelVraag(v);
    box.appendChild(b);
  }
}

// Vervolgvragen van één kast: de vragen uit dat domein als knoppen.
function kastKnoppen(sleutel, gegevraagd) {
  const box = document.getElementById("voorbeelden");
  box.innerHTML = "";
  for (const item of INHOUD.kasten[sleutel].items) {
    if (item.v === gegevraagd) continue;
    const b = document.createElement("button");
    b.textContent = item.v;
    b.onclick = () => stelVraag(item.v);
    box.appendChild(b);
  }
}

function stelVraag(v) {
  const vraag = v.trim();
  if (!vraag) return;
  zeg(vraag, true);
  document.getElementById("vraag").value = "";
  solve(vraag, null);
}

document.getElementById("stuur").onclick = () => stelVraag(document.getElementById("vraag").value);
document.getElementById("vraag").addEventListener("keydown", e => {
  if (e.key === "Enter") stelVraag(e.target.value);
});

initToneel();
initVoorbeelden();
zeg("Hoi! Ik ben BibBob. Stel een vraag of kies een voorbeeldvraag hieronder.", false);
</script>
