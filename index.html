

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boekenkast-Bot</title>
<style>
  :root {
    --toneel: #fbf9f4;
    --lijn: #3a3a3a;
    --accent: #c25b3a;
    --boek: #4a6d8c;
    --chat-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--toneel);
    color: var(--lijn);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    text-align: center;
    padding: 10px 0 4px;
    border-bottom: 1px solid #d8d2c4;
  }
  header h1 { margin: 0; font-size: 1.3em; }
  header p { margin: 2px 0 6px; font-size: 0.85em; color: #6b675e; }

  /* Toneel */
  #toneel {
    position: relative;
    height: 260px;
    overflow: hidden;
    background: linear-gradient(#fbf9f4 78%, #efe9dc 78%);
    flex: none;
  }
  .kast {
    position: absolute;
    bottom: 8px;
    width: 120px;
    transition: opacity 400ms, filter 400ms;
  }
  .kast.dim { opacity: 0.35; filter: grayscale(0.7); }
  .kast img.plaatje { width: 100%; display: block; }
  .kast svg { width: 100%; height: auto; }
  #kast_studentgegevens { left: 6%; }
  #kast_resultaatverwerking { left: 28%; }
  #kast_certificeren { left: 50%; }
  #kast_diplomeren { left: 72%; }
  .naambubbel {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1px solid var(--lijn);
    border-radius: 8px;
    padding: 1px 7px;
    font-size: 0.72em;
    white-space: nowrap;
    opacity: 1;
  }
  .boekje {
    position: absolute;
    left: 50%;
    top: -46px;
    transform: translateX(-50%) scale(0.3);
    opacity: 0;
    transition: transform 500ms ease, opacity 500ms;
  }
  .kast.pakuit .boekje { opacity: 1; transform: translateX(-50%) scale(1); }
  .faqkaart {
    position: absolute;
    right: 3%;
    bottom: 20px;
    width: 110px;
    opacity: 0;
    transform: rotate(-4deg) translateY(20px);
    transition: opacity 500ms, transform 500ms;
  }
  .faqkaart.aan { opacity: 1; transform: rotate(-4deg) translateY(0); }

  /* Chat */
  #chat {
    flex: 1;
    overflow-y: auto;
    background: var(--chat-bg);
    border-top: 1px solid #d8d2c4;
    padding: 10px 14px;
  }
  .regel { margin: 6px 0; line-height: 1.4; }
  .regel.jij { text-align: right; }
  .regel.jij span {
    display: inline-block;
    background: #efe9dc;
    border-radius: 10px 10px 0 10px;
    padding: 5px 10px;
  }
  .regel.bot span {
    display: inline-block;
    background: #f4f7fa;
    border: 1px solid #d7e0ea;
    border-radius: 10px 10px 10px 0;
    padding: 5px 10px;
    max-width: 85%;
  }
  #voorbeelden { padding: 6px 10px; border-top: 1px solid #eee; }
  #voorbeelden button, #stuur {
    font-family: inherit;
    background: var(--toneel);
    border: 1px solid #c9c2b2;
    border-radius: 12px;
    padding: 3px 10px;
    margin: 2px 3px 2px 0;
    cursor: pointer;
    font-size: 0.85em;
    color: var(--lijn);
  }
  #voorbeelden button:hover, #stuur:hover { background: #efe9dc; }
  #invoerrij {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    border-top: 1px solid #d8d2c4;
  }
  #vraag {
    flex: 1;
    font-family: inherit;
    font-size: 1em;
    padding: 7px 10px;
    border: 1px solid #c9c2b2;
    border-radius: 8px;
    background: #fff;
  }
  #stuur { border-radius: 8px; padding: 7px 14px; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Boekenkast-Bot</h1>
  <p>Ik kijk eerst in de FAQ. Helpt dat niet, dan pakken mijn kasten een boek erbij.</p>
</header>

<div id="toneel">
  <div class="kast" id="kast_studentgegevens"></div>
  <div class="kast" id="kast_resultaatverwerking"></div>
  <div class="kast" id="kast_certificeren"></div>
  <div class="kast" id="kast_diplomeren"></div>
  <div class="faqkaart" id="faqkaart"></div>
</div>

<div id="chat"></div>

<div id="voorbeelden"></div>

<div id="invoerrij">
  <input id="vraag" type="text" placeholder="Stel je vraag..." autocomplete="off">
  <button id="stuur">Vraag</button>
